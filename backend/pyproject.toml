[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeweave"
version = "1.0.0"
description = "Enterprise-Grade Full-Stack Data Pipeline Orchestration & Stream Processing Engine"
readme = "README.md"
authors = [{ name = "PipeWeave Team", email = "dev@pipeweave.io" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "duckdb>=0.10.0",
    "polars>=0.20.15",
    "pyarrow>=15.0.0",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "croniter>=2.0.3",
    "jinja2>=3.1.3",
    "jsonschema>=4.21.1",
    "fastavro>=1.9.4",
    "prometheus-client>=0.20.0",
    "networkx>=3.2.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "black>=24.2.0",
    "flake8>=7.0.0",
    "mypy>=1.9.0",
    "isort>=5.13.2"
]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["backend/src"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
